services:
  oracle-db:
    image: container-registry.oracle.com/database/free:23.4.0.0
    container_name: oracle23c_free
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PWD=${ORACLE_PWD}
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - sm_oracle_data:/opt/oracle/oradata
    shm_size: 2gb

volumes:
  sm_oracle_data:
    driver: local